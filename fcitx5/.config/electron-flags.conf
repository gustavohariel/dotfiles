# Part of the fcitx5 package. Chromium/Electron never calls the libxkbcommon
# compose API (verified: no xkb_compose_* symbols in the electron binary), so it
# ignores ~/.XCompose and composes dead_acute + c into "ć" from its own built-in
# table instead of the "ç" defined in xcompose/.XCompose.
# These flags make Electron accept composed text from fcitx5 over text-input-v3,
# which does honour ~/.XCompose.
--enable-wayland-ime
--wayland-text-input-version=3
